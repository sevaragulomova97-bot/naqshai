# Saytni GitHub Pages ga joylashtirish.
#
# Nima uchun kerak: Pages ni Settings dan qo'lda yoqish oson chalkashadi
# (manba tanlanmasa sayt 404 beradi). Bu workflow uni O'ZI yoqadi
# (configure-pages: enablement: true) va main ga har push da saytni
# yangilaydi — ya'ni sozlamalarga umuman kirish shart emas.
#
# Sayt bitta statik fayldan iborat (index.html), shuning uchun build yo'q:
# ombor mazmuni to'g'ridan-to'g'ri joylashtiriladi.

name: Saytni joylashtirish

on:
  push:
    branches: [main]
  workflow_dispatch:        # tugma bilan qo'lda ham ishga tushiriladi

permissions:
  contents: read
  pages: write
  id-token: write

# bir vaqtda bitta joylashtirish; boshlanganini bekor qilmaymiz
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Pages ni yoqish va sozlash
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Sayt fayllarini yuklash
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Joylashtirish
        id: deployment
        uses: actions/deploy-pages@v4
